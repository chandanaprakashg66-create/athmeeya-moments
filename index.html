<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Athmeeya Moments</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050306}
body{font-family:Georgia,"Times New Roman",serif;color:#fff}
.stage{position:relative;width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 50% 48%,rgba(211,90,128,.16),transparent 32%),
radial-gradient(circle at 50% 10%,rgba(245,190,92,.07),transparent 25%),#050306}
.page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
opacity:0;visibility:hidden;transform:scale(1.015);transition:opacity .8s ease,transform .8s ease}
.page.active{opacity:1;visibility:visible;transform:scale(1)}
.inner{width:min(92vw,900px);text-align:center;position:relative;padding:30px}
.decor{position:absolute;color:#e9bd5c;font-size:23px;opacity:.75}
.d1{left:8%;top:24%}.d2{right:9%;top:29%}.d3{left:13%;bottom:23%}.d4{right:12%;bottom:25%;color:#e895ad}
.title{font-size:clamp(34px,6vw,62px);font-weight:400;margin:0;color:#f6e8eb}
.title span{color:#e99aae}
.subtitle{font-size:clamp(18px,3vw,27px);margin-top:14px;color:#d9c7cc}
.tap{margin-top:30px;font:14px Arial,sans-serif;letter-spacing:2px;color:#bdaeb3;text-transform:uppercase}
.tap span{color:#eab15a}
.gift-area{width:330px;height:300px;margin:20px auto 0;position:relative;cursor:pointer}
.gift{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:245px;height:145px;
border-radius:6px;background:linear-gradient(135deg,#7f3155,#df7898 50%,#7a2d50);
border:2px solid #e8bc61;box-shadow:0 18px 40px #0009,0 0 28px #e87f9c22}
.gift:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:38px;transform:translateX(-50%);
background:linear-gradient(90deg,#d79c3c,#ffe38e,#d79c3c)}
.gift:after{content:"";position:absolute;left:0;right:0;top:44%;height:27px;
background:linear-gradient(#d79c3c,#ffe38e,#d79c3c)}
.lid{position:absolute;z-index:4;left:50%;top:73px;transform:translateX(-50%);width:276px;height:50px;
border-radius:7px;background:linear-gradient(135deg,#a94a70,#ef91ad 52%,#91385e);border:2px solid #e8bc61;
transition:transform 1.05s cubic-bezier(.2,.8,.2,1),opacity .7s}
.lid:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:39px;transform:translateX(-50%);
background:linear-gradient(90deg,#d79c3c,#ffe38e,#d79c3c)}
.ribbon{position:absolute;z-index:7;left:50%;top:25px;width:39px;height:98px;transform:translateX(-50%);
background:linear-gradient(90deg,#d79c3c,#ffe38e,#d79c3c);transition:opacity .5s}
.bow{position:absolute;z-index:9;left:50%;top:28px;transform:translateX(-50%);width:100px;height:62px;transition:transform 1s,opacity .6s}
.bow:before,.bow:after{content:"";position:absolute;top:2px;width:52px;height:39px;border:9px solid #efa2b9;
border-radius:60% 50% 45% 45%;filter:drop-shadow(0 0 5px #f5d8e0)}
.bow:before{right:48px;transform:rotate(-21deg)}.bow:after{left:48px;transform:rotate(21deg)}
.knot{position:absolute;z-index:10;left:50%;top:18px;width:27px;height:27px;transform:translateX(-50%);
border-radius:50%;background:#ffd36a;box-shadow:0 0 12px #ffd36a}
.tag{position:absolute;z-index:11;right:0;top:105px;background:#fff7e8;color:#745d50;padding:8px 9px;
font:12px Georgia,serif;transform:rotate(8deg);box-shadow:0 4px 8px #0007}
.logo-pop{position:absolute;z-index:3;left:50%;bottom:55px;width:min(57vw,370px);
transform:translate(-50%,100px) scale(.5);opacity:0;pointer-events:none}
.logo-pop img{width:100%;height:auto;display:block;object-fit:contain}
.opening .lid{transform:translate(-50%,-125px) rotate(-8deg);opacity:.15}
.opening .bow{transform:translate(-50%,-120px) rotate(15deg);opacity:0}
.opening .ribbon{opacity:0}
.opening .tag{transform:translate(110px,-90px) rotate(18deg);opacity:0;transition:1s}
.opening .gift{animation:boxfade 1.1s 1.0s forwards}
@keyframes boxfade{to{opacity:0;transform:translate(-50%,18px) scale(.88)}}
.opening .logo-pop{animation:logoRise 1.6s 1.0s cubic-bezier(.16,.84,.25,1) forwards}
@keyframes logoRise{
0%{opacity:0;transform:translate(-50%,100px) scale(.5)}
55%{opacity:1;transform:translate(-50%,-25px) scale(1.04)}
100%{opacity:1;transform:translate(-50%,-8px) scale(1)}
}
.sparkles{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0}
.opening .sparkles{animation:spark 1.8s 1s ease-out forwards}
.sparkles i{position:absolute;width:5px;height:5px;background:#ffd66a;border-radius:50%;box-shadow:0 0 14px #ffd66a}
.sparkles i:nth-child(1){left:22%;top:58%}.sparkles i:nth-child(2){left:31%;top:38%}
.sparkles i:nth-child(3){left:70%;top:35%}.sparkles i:nth-child(4){left:79%;top:60%}
.sparkles i:nth-child(5){left:48%;top:22%}.sparkles i:nth-child(6){left:54%;top:74%}
@keyframes spark{0%{opacity:0;transform:scale(.2)}35%{opacity:1}100%{opacity:0;transform:scale(1.8)}}
.reveal-note{margin-top:18px;color:#e9c264;font-size:18px;opacity:0}
.opening .reveal-note{animation:fadein .8s 2.1s forwards}
@keyframes fadein{to{opacity:1}}
.final-inner{width:min(92vw,760px);text-align:center}
.final-inner h2{font-size:clamp(30px,5vw,52px);font-weight:400;color:#f6e9ec;margin:0}
.final-inner h2 em{color:#e99aae}
.final-inner p{font-size:clamp(16px,2.4vw,21px);line-height:1.65;color:#ddd1d5;margin:22px auto 0;max-width:620px}
.order{color:#f3d26e;font-size:clamp(16px,2.4vw,20px);margin-top:12px}
.insta{display:inline-flex;align-items:center;gap:10px;margin-top:23px;padding:11px 21px;
border:1px solid #e7bb5e;border-radius:999px;color:#ed9fb5;text-decoration:none;font:600 16px Arial,sans-serif;
background:#ffffff08}
.insta svg{width:23px;height:23px;fill:#ed9fb5}
.thanks{font-size:14px;color:#9e9197;margin-top:20px}
@media(max-width:520px){
.gift-area{transform:scale(.84);margin-top:8px;margin-bottom:-25px}
.logo-pop{width:70vw}
}

.final-art{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#050306;overflow:hidden}
.final-art img{width:100%;height:100%;object-fit:cover;display:block}
.final-instagram-link{position:absolute;left:50%;top:70%;width:46%;height:13%;transform:translate(-50%,-50%);border-radius:999px;cursor:pointer}
@media (max-width:700px){
  .final-art img{object-fit:contain}
  .final-instagram-link{top:69%;width:68%;height:11%}
}
</style>
</head>
<body>
<div class="stage" id="stage">

<section class="page active" id="p1">
 <div class="inner">
  <div class="decor d1">✦</div><div class="decor d2">♡</div><div class="decor d3">✧</div><div class="decor d4">♡</div>
  <h1 class="title">Here’s to a <span>new little beginning…</span></h1>
  <div class="tap">Tap to continue <span>✦</span></div>
 </div>
</section>

<section class="page" id="p2">
 <div class="inner">
  <div class="decor d1">✦</div><div class="decor d2">♡</div>
  <h1 class="title">For moments, <span>big and little.</span></h1>
  <div class="tap">Tap to continue <span>✦</span></div>
 </div>
</section>

<section class="page" id="p3">
 <div class="inner">
  <div class="decor d1">✦</div><div class="decor d2">♡</div>
  <div class="gift-area" onclick="openGift()" role="button" tabindex="0" aria-label="Tap gift to unwrap">
   <div class="bow"><div class="knot"></div></div>
   <div class="lid"></div><div class="ribbon"></div><div class="gift"></div><div class="tag">For<br>you</div>
   <div class="logo-pop"><img src="athmeeya-logo.png" alt="Athmeeya Moments"></div>
   <div class="sparkles"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="tap">🎁 <span>Tap the gift to unwrap</span> ✨</div>
  <div class="reveal-note">Something special, made with love ♡</div>
 </div>
</section>

<section class="page" id="p4">
 <div class="final-art" role="img" aria-label="Athmeeya Moments — made with love">
   <img src="final-page.png" alt="Made with love, to make you smile. Athmeeya Moments Instagram and ordering information.">
   <a class="final-instagram-link" href="https://www.instagram.com/athmeeya.moments/" target="_blank" rel="noopener" aria-label="Visit Athmeeya Moments on Instagram"></a>
 </div>
</section>

</div>
<script>
let page=1,opened=false;
const pages=[null,p1,p2,p3,p4];
function go(n){
 pages[page].classList.remove('active');
 page=n;pages[page].classList.add('active');
}
function openGift(){
 if(opened)return; opened=true;
 p3.classList.add('opening');
 setTimeout(()=>go(4),4700);
}
document.getElementById('stage').addEventListener('click',e=>{
 if(page===1)go(2);
 else if(page===2)go(3);
 else if(page===3)openGift();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){page=1;opened=false;p3.classList.remove('opening');pages.forEach((x,i)=>x&&x.classList.toggle('active',i===1))}
 if((e.key==='Enter'||e.key===' ')&&page<3){e.preventDefault();go(page+1)}
 if((e.key==='Enter'||e.key===' ')&&page===3){e.preventDefault();openGift()}
});
</script>
</body>
</html>
