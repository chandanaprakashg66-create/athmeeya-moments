<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Little Surprise ♡</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#070508;overflow:hidden}
body{font-family:Georgia,"Times New Roman",serif}
.stage{width:100%;height:100vh;position:relative;overflow:hidden;background:#070508}
.panel{
  position:absolute;inset:0;width:100%;height:100%;
  background-repeat:no-repeat;background-position:center;background-size:cover;
  opacity:0;transform:scale(1.015);
  transition:opacity .9s ease,transform .9s ease;
  pointer-events:none;
}
.panel.active{opacity:1;transform:scale(1);pointer-events:auto}
#p1{background-image:url("panel1.png")}
#p2{background-image:url("panel2.png")}
#p3{background-image:url("panel3.png")}

.hotspot{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-36%);
  width:min(44vw,460px);height:min(35vh,310px);
  border:0;background:transparent;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.hotspot:focus-visible{outline:2px solid #f5cb63;outline-offset:8px;border-radius:20px}
.hint{
  position:absolute;left:50%;bottom:5%;
  transform:translateX(-50%);
  color:#fff;font-size:15px;letter-spacing:.3px;
  opacity:.0;transition:opacity .5s;
  pointer-events:none;
}
#p1.active .hint{opacity:.001}
.loading{
 position:absolute;inset:auto 0 10px;text-align:center;
 color:#d8c8cf;font:12px Arial,sans-serif;opacity:.55;pointer-events:none
}
@media(max-width:600px){
 .panel{background-size:cover}
 .hotspot{width:75vw;height:30vh;top:50%}
}
</style>
</head>
<body>
<div class="stage" aria-label="Athmeeya Moments surprise">
  <section id="p1" class="panel active">
    <button class="hotspot" aria-label="Tap the gift box to unwrap" onclick="unwrap()"></button>
    <div class="hint">Tap the gift box to unwrap</div>
  </section>
  <section id="p2" class="panel" aria-hidden="true"></section>
  <section id="p3" class="panel" aria-hidden="true"></section>
  <div class="loading" id="loading">♡</div>
</div>

<script>
let step=0;
function show(id){
  document.querySelectorAll('.panel').forEach(p=>{
    p.classList.remove('active');
    p.setAttribute('aria-hidden','true');
  });
  const el=document.getElementById(id);
  el.classList.add('active');
  el.setAttribute('aria-hidden','false');
}
function unwrap(){
  if(step!==0)return;
  step=1;
  show('p2');
  // Give the opening/reveal moment time to be enjoyed, then show the final page.
  setTimeout(()=>{step=2;show('p3')},3000);
}
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ') && step===0) unwrap();
});
</script>
</body>
</html>
